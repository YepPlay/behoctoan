<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f57c00">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bé Học Toán">
  <meta name="application-name" content="Bé Học Toán">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; worker-src 'self'; manifest-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Bé Học Toán — Toán Tiểu Học</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="decor" class="decor"></div>

  <!-- 1. Chọn bé -->
  <section id="screen-choose" class="screen active">
    <div class="screen-body">
      <div class="fit">
        <h1 class="title">🧮 Bé Học Toán 🎓</h1>
        <p class="subtitle">Toán tiểu học lớp 1 – 5</p>
        <div class="choose-row">
          <button class="choose-card boy" data-theme="boy">
            <span class="avatar">🧒</span>
            <span class="choose-name">Bé Trai</span>
          </button>
          <button class="choose-card girl" data-theme="girl">
            <span class="avatar">👧</span>
            <span class="choose-name">Bé Gái</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- 2. Chọn cách học -->
  <section id="screen-way" class="screen">
    <div class="screen-body">
      <div class="fit">
        <h1 class="title">Bé muốn học thế nào?</h1>
        <div class="choose-row">
          <button class="choose-card way" data-way="class">
            <span class="avatar">🎓</span>
            <span class="choose-name">Theo Lớp</span>
            <span class="choose-desc">Học đúng bài trên lớp</span>
          </button>
          <button class="choose-card way" data-way="mode">
            <span class="avatar">🎮</span>
            <span class="choose-name">Theo Chế Độ</span>
            <span class="choose-desc">Chọn môn mình thích</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. Chọn lớp -->
  <section id="screen-grade" class="screen">
    <header class="screen-head menu-head">
      <button id="btn-grade-back" class="icon-btn" title="Quay lại">⬅️</button>
      <div id="menu-avatar-g" class="menu-avatar">🧒</div>
      <button class="donate-btn" title="Ủng hộ tác giả"><span class="donate-ico">💰</span><span class="donate-txt">Ủng&nbsp;Hộ</span></button>
    </header>
    <div class="screen-body">
      <div class="fit">
        <h1 class="title">Chọn lớp của bé</h1>
        <div class="grade-row" id="grade-row">
          <button class="grade-card" data-grade="1"><span class="grade-num">1️⃣</span><span class="grade-name">Lớp 1</span></button>
          <button class="grade-card" data-grade="2"><span class="grade-num">2️⃣</span><span class="grade-name">Lớp 2</span></button>
          <button class="grade-card" data-grade="3"><span class="grade-num">3️⃣</span><span class="grade-name">Lớp 3</span></button>
          <button class="grade-card" data-grade="4"><span class="grade-num">4️⃣</span><span class="grade-name">Lớp 4</span></button>
          <button class="grade-card" data-grade="5"><span class="grade-num">5️⃣</span><span class="grade-name">Lớp 5</span></button>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. Menu chế độ -->
  <section id="screen-menu" class="screen">
    <header class="screen-head menu-head">
      <button id="btn-switch" class="icon-btn" title="Đổi cách học">🔄</button>
      <div id="menu-avatar" class="menu-avatar">🧒</div>
      <button class="donate-btn" title="Ủng hộ tác giả"><span class="donate-ico">💰</span><span class="donate-txt">Ủng&nbsp;Hộ</span></button>
    </header>
    <div class="screen-body">
      <div class="fit">
        <div class="menu-sub" id="menu-sub">🎓 Theo lớp</div>
        <div class="mode-grid" id="mode-grid">
          <button class="mode-card featured" data-mode="num">
            <span class="mode-icon">🔢</span>
            <span class="mode-name">Học Số</span>
            <span class="mode-lock"></span>
          </button>
          <button class="mode-card" data-mode="calc">
            <span class="mode-icon">➕</span>
            <span class="mode-name">Cộng &amp; Trừ</span>
            <span class="mode-lock"></span>
          </button>
          <button class="mode-card" data-mode="cmp">
            <span class="mode-icon">⚖️</span>
            <span class="mode-name">So Sánh</span>
            <span class="mode-lock"></span>
          </button>
          <button class="mode-card" data-mode="mul">
            <span class="mode-icon">✖️</span>
            <span class="mode-name">Nhân &amp; Chia</span>
            <span class="mode-lock"></span>
          </button>
          <button class="mode-card" data-mode="frac">
            <span class="mode-icon">🍕</span>
            <span class="mode-name">Phân Số</span>
            <span class="mode-lock"></span>
          </button>
          <button class="mode-card" data-mode="dec">
            <span class="mode-icon">💰</span>
            <span class="mode-name">Số Thập Phân</span>
            <span class="mode-lock"></span>
          </button>
          <button class="mode-card" data-mode="pct">
            <span class="mode-icon">🏷️</span>
            <span class="mode-name">Phần Trăm</span>
            <span class="mode-lock"></span>
          </button>
          <button class="mode-card" data-mode="measure">
            <span class="mode-icon">📏</span>
            <span class="mode-name">Đo &amp; Đo Lường</span>
            <span class="mode-lock"></span>
          </button>
          <button class="mode-card" data-mode="shape">
            <span class="mode-icon">🔷</span>
            <span class="mode-name">Hình Học</span>
            <span class="mode-lock"></span>
          </button>
          <button class="mode-card" data-mode="story">
            <span class="mode-icon">📖</span>
            <span class="mode-name">Toán Lời Văn</span>
            <span class="mode-lock"></span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- 5. Chơi -->
  <section id="screen-play" class="screen">
    <header class="screen-head play-head">
      <button id="btn-back" class="icon-btn" title="Về menu">⬅️</button>
      <div class="play-progress" id="play-progress"></div>
      <button class="donate-btn" title="Ủng hộ tác giả"><span class="donate-ico">💰</span><span class="donate-txt">Ủng&nbsp;Hộ</span></button>
    </header>
    <div class="screen-body">
      <div class="fit">
        <div id="play-area"></div>
      </div>
    </div>
  </section>

  <div id="fx-layer"></div>

  <!-- Popup chọn mức (chế độ) -->
  <div id="level-popup" class="popup">
    <div class="popup-backdrop" id="level-backdrop"></div>
    <div class="popup-card">
      <div class="popup-title" id="level-title">Chọn mức</div>
      <div class="level-row" id="level-row">
        <button class="level-card" data-level="1"><span class="level-ico">🌱</span><span class="level-name">Dễ</span></button>
        <button class="level-card" data-level="3"><span class="level-ico">💪</span><span class="level-name">Vừa</span></button>
        <button class="level-card" data-level="5"><span class="level-ico">🚀</span><span class="level-name">Khó</span></button>
      </div>
      <button class="btn" id="level-close">Đóng</button>
    </div>
  </div>

  <!-- Popup tổng kết phiên -->
  <div id="summary-popup" class="popup">
    <div class="popup-backdrop"></div>
    <div class="popup-card summary-card">
      <div class="summary-emoji" id="summary-emoji">🎉</div>
      <div class="summary-title" id="summary-title">Giỏi lắm!</div>
      <div class="summary-count"><span id="summary-correct">0</span> đúng / <span id="summary-total">0</span> câu</div>
      <div class="summary-stars" id="summary-stars"></div>
      <div class="summary-rating" id="summary-rating">Tốt</div>
      <div class="summary-btns">
        <button class="btn big" id="btn-continue">🔙 Chơi Tiếp</button>
        <button class="btn big" id="btn-exit">🏠 Thoát</button>
      </div>
    </div>
  </div>

  <!-- Popup ủng hộ (giữ nguyên behocchu) -->
  <div id="donate-popup" class="popup">
    <div class="popup-backdrop" id="donate-backdrop"></div>
    <div class="popup-card donate-card">
      <div class="donate-col-img">
        <img class="donate-img" src="assets/images/donate.jpg" alt="Mã QR số tài khoản ngân hàng">
      </div>
      <div class="donate-col-info">
        <div class="popup-title">💛 Ủng Hộ</div>
        <p class="donate-caption">Ủng hộ tác giả để duy trì phần mềm</p>
        <div class="donate-stk">
          <span class="donate-stk-label">Số tài khoản</span>
          <span class="donate-stk-num" id="donate-stk-num">19031570236699</span>
        </div>
        <div class="donate-actions">
          <button class="btn donate-act" id="donate-copy">📋 Copy STK</button>
          <a class="btn donate-act" id="donate-save" href="assets/images/donate.jpg" download="ma-qr-ung-ho.jpg">⬇️ Tải ảnh QR</a>
        </div>
        <button class="btn" id="donate-close">Đóng</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/games.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
